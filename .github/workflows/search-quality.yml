name: SZARA search quality and IndexNow
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: szara-search-indexnow
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/search_qa.py
  notify:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Submit changed URLs to IndexNow
        env:
          BEFORE: ${{ github.event.before }}
          FULL: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 scripts/indexnow.py

  live-redirects:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify permanent redirects and preserved articles
        run: |
          python3 - <<'PY'
          import urllib.request
          import urllib.error
          import urllib.parse
          import xml.etree.ElementTree as ET
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          opener.addheaders = [('User-Agent', 'SZARA-Search-Check/1.0 (+https://withszara.com/)')]
          failures = []
          def inspect(url):
              try:
                  response = opener.open(url, timeout=20)
              except urllib.error.HTTPError as error:
                  response = error
              with response:
                  return response.code, response.headers.get('Location', '')
          for host in ('withszara.com', 'www.withszara.com'):
              for source, target in (('/advice', '/insights/'), ('/small-business-websites', '/web-design/')):
                  for suffix in ('', '/'):
                      query = '?redirect_check=1&source=qa'
                      url = 'https://' + host + source + suffix + query
                      status, location = inspect(url)
                      expected = 'https://withszara.com' + target + query
                      print(f'{status} {url} -> {location}', flush=True)
                      if status != 301 or location != expected:
                          failures.append(url)
          root = ET.parse('sitemap.xml').getroot()
          articles = [node.text for node in root.iter('{http://www.sitemaps.org/schemas/sitemap/0.9}loc')
                      if urllib.parse.urlparse(node.text).path.startswith(('/advice/', '/insights/'))
                      and urllib.parse.urlparse(node.text).path not in ('/advice/', '/insights/')]
          required = ["https://withszara.com/advice/small-business-website-cost/","https://withszara.com/advice/website-or-facebook/","https://withszara.com/advice/website-maintenance-cost/","https://withszara.com/advice/wix-vs-web-designer/","https://withszara.com/advice/small-business-website-checklist/","https://withszara.com/insights/is-your-home-router-secure/","https://withszara.com/insights/who-can-access-your-security-cameras/","https://withszara.com/insights/invoice-fraud-small-businesses/","https://withszara.com/insights/who-controls-your-business-website/","https://withszara.com/insights/website-contact-form-not-working/","https://withszara.com/insights/small-business-website-maintenance-checklist/","https://withszara.com/insights/small-business-automation-first-workflow/","https://withszara.com/insights/small-business-website-audit-cost/","https://withszara.com/insights/online-booking-setup-small-business/","https://withszara.com/insights/hoa-website-maintenance-security/","https://withszara.com/insights/why-website-not-generating-leads/","https://withszara.com/insights/mobile-vs-desktop-website-performance/","https://withszara.com/insights/understanding-website-performance-scores/","https://withszara.com/insights/perfect-website-score-business-success/","https://withszara.com/insights/how-to-audit-your-website/"]
          missing = set(required) - set(articles)
          if missing:
              failures.append('Missing preserved articles: ' + ', '.join(sorted(missing)))
          for url in articles + ['https://withszara.com/sitemap.xml', 'https://withszara.com/ab9eaed911fddcb7e36d234e7aaa9e444.txt']:
              status, location = inspect(url)
              print(f'{status} ARTICLE {url}', flush=True)
              if status != 200:
                  failures.append(url)
          if failures:
              raise SystemExit('Failed live checks: ' + ', '.join(failures))
          print(f'PASS: 8 exact redirects preserve queries; all {len(articles)} article URLs return 200.')
          PY
